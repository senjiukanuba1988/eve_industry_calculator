[package]
name = "eve_industry_calculator"
# The app version lives in ../package.json; tauri.conf.json reads it from there.
# This crate version is not shown anywhere and is left at 0.0.0 on purpose.
version = "0.0.0"
description = "EVE Industry Calculator"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "eve_industry_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
